<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2c241c"/>
      <stop offset="70%" stop-color="#12100a"/>
      <stop offset="100%" stop-color="#060504"/>
    </radialGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4820"/>
      <stop offset="40%" stop-color="#3a3818"/>
      <stop offset="100%" stop-color="#252310"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#6e4c34"/>
      <stop offset="40%" stop-color="#5c3e2a"/>
      <stop offset="100%" stop-color="#4a2e1e"/>
    </linearGradient>
    <linearGradient id="brimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d3a1a"/>
      <stop offset="100%" stop-color="#1c1a0a"/>
    </linearGradient>
  </defs>

  <!-- Background matching studio dark -->
  <rect width="640" height="640" fill="url(#bgGrad)"/>

  <!-- ========== HAT (positioned lower on head like photo) ========== -->
  <!-- Crown - more rounded, sits lower -->
  <path d="M 110 195 
           C 110 100, 200 55, 320 48 
           C 440 55, 530 100, 530 195 
           C 530 235, 440 260, 320 265 
           C 200 260, 110 235, 110 195 Z" 
        fill="url(#hatGrad)"/>
  
  <!-- Camo texture patches - irregular for RealTree-ish look -->
  <ellipse cx="200" cy="130" rx="60" ry="35" fill="#252310" opacity="0.6"/>
  <ellipse cx="440" cy="140" rx="55" ry="30" fill="#252310" opacity="0.55"/>
  <ellipse cx="320" cy="95" rx="50" ry="25" fill="#555228" opacity="0.4"/>
  <ellipse cx="160" cy="170" rx="40" ry="25" fill="#1a1808" opacity="0.5"/>
  <ellipse cx="480" cy="165" rx="42" ry="22" fill="#1a1808" opacity="0.45"/>
  <ellipse cx="270" cy="160" rx="35" ry="20" fill="#3a3818" opacity="0.35"/>
  <ellipse cx="380" cy="155" rx="32" ry="18" fill="#3a3818" opacity="0.35"/>
  <ellipse cx="230" cy="100" rx="25" ry="15" fill="#1a1808" opacity="0.3"/>
  <ellipse cx="410" cy="105" rx="22" ry="14" fill="#1a1808" opacity="0.3"/>

  <!-- Brim - prominent curved bill -->
  <path d="M 70 200 
           C 70 255, 180 300, 320 305 
           C 460 300, 570 255, 570 200 
           C 570 170, 460 145, 320 140 
           C 180 145, 70 170, 70 200 Z" 
        fill="url(#brimGrad)"/>

  <!-- Raised front panel -->
  <ellipse cx="320" cy="150" rx="125" ry="62" fill="#3a3818"/>

  <!-- Deer logo - closer to original Buckmasters style -->
  <g transform="translate(0,5)">
    <ellipse cx="320" cy="112" rx="26" ry="21" fill="#7a5030"/>
    <ellipse cx="300" cy="102" rx="8" ry="13" fill="#7a5030"/>
    <ellipse cx="340" cy="102" rx="8" ry="13" fill="#7a5030"/>
    <ellipse cx="320" cy="126" rx="12" ry="10" fill="#5c3a20"/>
    <ellipse cx="320" cy="130" rx="5" ry="4" fill="#2a1a10"/>
    <circle cx="311" cy="108" r="2.8" fill="#1a1008"/>
    <circle cx="329" cy="108" r="2.8" fill="#1a1008"/>
    <!-- Antlers more matching the logo style -->
    <path d="M 302 104 Q 270 75 262 42 M 288 82 Q 255 72 248 50 M 295 92 Q 270 85 262 70" 
          fill="none" stroke="#7a5030" stroke-width="4" stroke-linecap="round"/>
    <path d="M 338 104 Q 370 75 378 42 M 352 82 Q 385 72 392 50 M 345 92 Q 370 85 378 70" 
          fill="none" stroke="#7a5030" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- BUCKMASTERS text - bold white-ish -->
  <text x="320" y="172" text-anchor="middle" 
        font-family="Impact, Arial Black, sans-serif" 
        font-size="18" font-weight="900" fill="#f5f0e6" letter-spacing="2.2">BUCKMASTERS</text>

  <!-- ========== FACE (larger, more of the frame like the tight crop) ========== -->
  <path d="M 175 265 
           C 155 310, 150 380, 168 435 
           C 190 495, 250 535, 320 540 
           C 390 535, 450 495, 472 435 
           C 490 380, 485 310, 465 265 
           C 440 215, 380 205, 320 205 
           C 260 205, 200 215, 175 265 Z" 
        fill="url(#skinGrad)"/>

  <!-- Depth shading -->
  <ellipse cx="225" cy="370" rx="50" ry="60" fill="#3a2418" opacity="0.3"/>
  <ellipse cx="415" cy="370" rx="50" ry="60" fill="#3a2418" opacity="0.3"/>
  <ellipse cx="320" cy="250" rx="110" ry="45" fill="#3a2418" opacity="0.4"/>

  <!-- Ears - partially visible under hat -->
  <ellipse cx="160" cy="335" rx="34" ry="50" fill="#4a3020"/>
  <ellipse cx="480" cy="335" rx="34" ry="50" fill="#4a3020"/>
  <ellipse cx="160" cy="335" rx="17" ry="30" fill="#3a2418"/>
  <ellipse cx="480" cy="335" rx="17" ry="30" fill="#3a2418"/>

  <!-- ========== GLASSES (very recognizable thin dark frames) ========== -->
  <rect x="195" y="295" width="100" height="70" rx="15" ry="15" 
        fill="none" stroke="#0e0a06" stroke-width="7.5"/>
  <rect x="345" y="295" width="100" height="70" rx="15" ry="15" 
        fill="none" stroke="#0e0a06" stroke-width="7.5"/>
  <path d="M 295 325 Q 320 315 345 325" fill="none" stroke="#0e0a06" stroke-width="6.5"/>
  <path d="M 195 315 Q 145 310 130 340" fill="none" stroke="#0e0a06" stroke-width="6.5"/>
  <path d="M 445 315 Q 495 310 510 340" fill="none" stroke="#0e0a06" stroke-width="6.5"/>
  
  <!-- Subtle glass tint + reflection -->
  <rect x="200" y="300" width="90" height="60" rx="12" ry="12" fill="#90b8e0" opacity="0.09"/>
  <rect x="350" y="300" width="90" height="60" rx="12" ry="12" fill="#90b8e0" opacity="0.09"/>
  <path d="M 205 303 L 280 303" stroke="#5a5040" stroke-width="2" opacity="0.35"/>
  <path d="M 355 303 L 430 303" stroke="#5a5040" stroke-width="2" opacity="0.35"/>

  <!-- ========== EYES ========== -->
  <ellipse cx="245" cy="328" rx="22" ry="17" fill="#1a1008"/>
  <ellipse cx="395" cy="328" rx="22" ry="17" fill="#1a1008"/>
  <ellipse cx="245" cy="328" rx="13" ry="13" fill="#050403"/>
  <ellipse cx="395" cy="328" rx="13" ry="13" fill="#050403"/>
  <circle cx="252" cy="321" r="5" fill="#e8e0d0"/>
  <circle cx="402" cy="321" r="5" fill="#e8e0d0"/>
  <circle cx="240" cy="333" r="2.2" fill="#706050" opacity="0.5"/>
  <circle cx="390" cy="333" r="2.2" fill="#706050" opacity="0.5"/>

  <!-- Thick brows matching photo -->
  <path d="M 200 285 Q 245 270 285 285" fill="none" stroke="#1a1008" stroke-width="9" stroke-linecap="round"/>
  <path d="M 355 285 Q 395 270 440 285" fill="none" stroke="#1a1008" stroke-width="9" stroke-linecap="round"/>

  <!-- ========== NOSE (broad, matching) ========== -->
  <path d="M 320 340 L 300 395 Q 320 412 340 395 Z" fill="#4a3020"/>
  <ellipse cx="307" cy="400" rx="10" ry="7" fill="#2a1a10"/>
  <ellipse cx="333" cy="400" rx="10" ry="7" fill="#2a1a10"/>
  <ellipse cx="320" cy="365" rx="10" ry="20" fill="#6a4a32" opacity="0.3"/>

  <!-- ========== MOUTH / BEARD ========== -->
  <ellipse cx="320" cy="430" rx="60" ry="22" fill="#2a1a10" opacity="0.5"/>
  <path d="M 265 445 Q 320 465 375 445" fill="none" stroke="#1a1008" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="320" cy="455" rx="35" ry="12" fill="#4a3020" opacity="0.5"/>

  <!-- Full chin stubble/beard -->
  <path d="M 210 475 
           Q 270 525 320 530 
           Q 370 525 430 475 
           Q 380 515 320 520 
           Q 260 515 210 475 Z" 
        fill="#1a1008" opacity="0.85"/>
  <ellipse cx="195" cy="415" rx="30" ry="50" fill="#1a1008" opacity="0.3"/>
  <ellipse cx="445" cy="415" rx="30" ry="50" fill="#1a1008" opacity="0.3"/>

  <!-- ========== SHIRT ========== -->
  <path d="M 140 510 
           C 170 560, 250 600, 320 595 
           C 390 600, 470 560, 500 510 
           L 540 640 L 100 640 Z" 
        fill="#060504"/>
  <path d="M 185 520 L 250 580 L 320 545" fill="none" stroke="#12100c" stroke-width="14" stroke-linecap="round"/>
  <path d="M 455 520 L 390 580 L 320 545" fill="none" stroke="#12100c" stroke-width="14" stroke-linecap="round"/>

</svg>